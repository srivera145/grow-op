<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Grow Op</title>
    <!-- Inline placeholder icon so the browser does not request a missing /favicon.ico -->
    <link rel="icon" href="assets/favicon.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none; /* no pull-to-refresh or rubber-band scrolling under a dragging thumb */
        -webkit-user-select: none;
        user-select: none; /* a long press must not start a text selection */
        -webkit-touch-callout: none;
      }
      body {
        /* viewport-fit=cover lets the page run under the notch and home indicator; this padding keeps the game,
           and so the touch buttons, inside the safe area. It is zero everywhere else. */
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game,
      canvas {
        touch-action: none; /* no double-tap zoom, no page scroll or pinch while playing */
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
