<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/assets/favicon.png" />
    <title>Grow Op level editor</title>
    <style>
      :root {
        --bg: #101a13;
        --panel: #16241a;
        --line: #24382a;
        --text: #d8f3dc;
        --dim: #8fae97;
        --green: #4cd137;
        --gold: #ffd60a;
        --red: #e8443a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        grid-template-columns: 260px 1fr;
        grid-template-rows: auto 1fr;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--bg);
        color: var(--text);
      }

      header {
        grid-column: 1 / -1;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      header h1 { font-size: 14px; margin: 0 8px 0 0; color: var(--green); letter-spacing: 0.04em; }
      header .spacer { flex: 1; }
      #status { color: var(--dim); }
      #status.ok { color: var(--green); }
      #status.warn { color: var(--gold); }
      #status.error { color: var(--red); }
      #saved { color: var(--dim); min-width: 12em; }

      button, input, select {
        font: inherit;
        color: var(--text);
        background: #1e3123;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 4px 10px;
      }
      button { cursor: pointer; }
      button:hover { background: #2a442f; }
      button.active { background: var(--green); color: #0d1a10; border-color: var(--green); }
      input[type='text'], input[type='number'] { background: #0d1711; }
      input[type='number'] { width: 5em; }

      aside {
        overflow-y: auto;
        padding: 10px 12px;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }
      aside h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 14px 0 6px;
      }
      aside section:first-child h2 { margin-top: 0; }
      .buttons { display: flex; gap: 6px; }
      .buttons button { flex: 1; }
      .types { display: flex; flex-direction: column; gap: 3px; }
      .type { display: flex; align-items: center; gap: 8px; text-align: left; padding: 3px 8px; }
      .type i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
      .size { display: flex; gap: 6px; align-items: center; }
      .size label { display: flex; gap: 4px; align-items: center; color: var(--dim); }

      .fields { display: flex; flex-direction: column; gap: 4px; }
      .field { display: flex; gap: 6px; align-items: center; color: var(--dim); }
      .field span { width: 4.5em; flex: none; }
      .field input { flex: 1; min-width: 0; padding: 2px 6px; }

      .field select { flex: 1; min-width: 0; padding: 2px 6px; }
      button.danger { border-color: #6d2a25; color: #f0a9a3; margin-top: 4px; }
      button.danger:hover { background: #8f2222; color: #fff; border-color: #8f2222; }

      .levels { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
      .level-row { border: 1px solid var(--line); border-radius: 3px; padding: 5px 6px; display: flex; flex-direction: column; gap: 3px; }
      .level-head { display: flex; align-items: center; gap: 4px; }
      .level-head code { flex: 1; color: var(--green); }
      .move { padding: 0 6px; line-height: 1.4; }
      .move:disabled { opacity: 0.3; cursor: default; }
      #save-index { width: 100%; }

      aside textarea {
        width: 100%;
        font: inherit;
        color: var(--text);
        background: #0d1711;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 4px 6px;
        resize: vertical;
      }
      button:disabled { opacity: 0.45; cursor: default; }
      button:disabled:hover { background: #1e3123; }
      .note { margin: 6px 0 0; color: var(--dim); }
      .note[data-severity='error'] { color: var(--red); }
      .note[data-severity='warn'] { color: var(--gold); }
      #generate .size { margin-top: 6px; }
      #generate .buttons { margin-top: 6px; }
      #generate-run { width: 100%; margin-top: 6px; }
      #generate-preview {
        display: block;
        width: 100%;
        height: auto;
        margin-top: 8px;
        border: 1px solid var(--line);
        border-radius: 3px;
        image-rendering: pixelated;
      }

      .problems { list-style: none; margin: 0; padding: 0; }
      .problems li { padding: 3px 0 3px 14px; text-indent: -14px; }
      .problems li.error { color: var(--red); }
      .problems li.error::before { content: '! '; }
      .problems li.warn { color: var(--gold); }
      .problems li.warn::before { content: '? '; }
      .problems li.ok { color: var(--dim); }

      .help { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; color: var(--dim); }
      .help dt { color: var(--text); white-space: nowrap; }
      .help dd { margin: 0; }

      main { position: relative; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
      #readout {
        position: absolute;
        right: 10px;
        bottom: 10px;
        padding: 4px 8px;
        background: rgba(13, 23, 17, 0.85);
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--dim);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GROW OP EDITOR</h1>
      <label>Level <input id="name" type="text" value="world1-1" size="12" /></label>
      <button id="load" type="button">Load</button>
      <button id="save" type="button">Save</button>
      <button id="download" type="button">Download</button>
      <button id="play" type="button">Play</button>
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <span class="spacer"></span>
      <span id="status"></span>
      <span id="saved"></span>
    </header>
    <aside>
      <div id="generate"></div>
      <div id="palette"></div>
    </aside>
    <main>
      <canvas id="canvas"></canvas>
      <div id="readout"></div>
    </main>
    <script type="module" src="/src/editor/main.js"></script>
  </body>
</html>
